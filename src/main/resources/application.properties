# ==========================================================
#  Radiografía Crediticia - configuración principal
# ==========================================================
spring.application.name=radiografia-crediticia
server.port=${PORT:8080}

# ---------- Base de datos H2 (desarrollo local, persistida en ./data) ----------
spring.datasource.url=jdbc:h2:file:./data/radiografiacrediticia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Carga de archivos ----------
# El servicio valida los límites reales (hasta 10 capturas, 5 MB cada una, 20 MB en total)
# con mensajes amigables; los límites del servidor son un poco mayores para que esa
# validación alcance a ejecutarse.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=26MB
server.tomcat.max-swallow-size=-1

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- API de Anthropic (Claude) ----------
# La API key se lee de la variable de entorno ANTHROPIC_API_KEY. Nunca la escribas aquí.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.api-url=https://api.anthropic.com
# claude-3-5-sonnet-20240620 fue retirado por Anthropic (28/10/2025); se usa su sucesor vigente.
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
anthropic.max-tokens=16000
anthropic.timeout-seconds=300

# ---------- Reglas de negocio ----------
# Una radiografía por usuario por mes calendario. Pon LIMITE_MENSUAL=false para hacer pruebas.
radiografia.limite-mensual=${LIMITE_MENSUAL:true}
