<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cree su cuenta')}"></head>
<body>
<main class="auth">
    <span class="logo-tile"><img th:src="@{/img/logo-icon.png}" alt="Radiografía Crediticia"></span>
    <h1 class="titulo">Cree su cuenta</h1>

    <form th:action="@{/register}" th:object="${form}" method="post" class="form" novalidate>
        <label for="fullName">Nombre completo</label>
        <input class="campo" type="text" id="fullName" th:field="*{fullName}" required maxlength="120"
               th:classappend="${#fields.hasErrors('fullName')} ? 'invalid'" autocomplete="name">
        <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>

        <label for="email">Correo</label>
        <input class="campo" type="email" id="email" th:field="*{email}" required maxlength="150"
               th:classappend="${#fields.hasErrors('email')} ? 'invalid'" autocomplete="email">
        <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

        <label for="password">Contraseña</label>
        <input class="campo" type="password" id="password" th:field="*{password}" required minlength="8" maxlength="72"
               th:classappend="${#fields.hasErrors('password')} ? 'invalid'" autocomplete="new-password">
        <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

        <label for="confirmPassword">Confirme su contraseña</label>
        <input class="campo" type="password" id="confirmPassword" th:field="*{confirmPassword}" required
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid'" autocomplete="new-password">
        <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>

        <button type="submit" class="btn btn-primario btn-bloque">Crear cuenta</button>
    </form>

    <p class="auth-pie">¿Ya tiene cuenta? <a th:href="@{/login}">Ingrese aquí</a></p>
</main>
</body>
</html>
