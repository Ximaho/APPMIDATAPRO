<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro · MiDataCrédito Analyzer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand">
        <span class="brand-mark">MD</span>
        <div>
            <h1>Crear cuenta</h1>
            <p class="muted">Registra tus datos para empezar a analizar tu historial</p>
        </div>
    </div>

    <form th:action="@{/register}" th:object="${form}" method="post" class="form" novalidate>
        <label for="fullName">Nombre completo</label>
        <input type="text" id="fullName" th:field="*{fullName}" required maxlength="120"
               th:classappend="${#fields.hasErrors('fullName')} ? 'invalid'" autocomplete="name">
        <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" th:field="*{email}" required maxlength="150"
               th:classappend="${#fields.hasErrors('email')} ? 'invalid'" autocomplete="email">
        <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

        <label for="password">Contraseña</label>
        <input type="password" id="password" th:field="*{password}" required minlength="8" maxlength="72"
               th:classappend="${#fields.hasErrors('password')} ? 'invalid'" autocomplete="new-password">
        <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid'" autocomplete="new-password">
        <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>

        <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</main>
</body>
</html>
