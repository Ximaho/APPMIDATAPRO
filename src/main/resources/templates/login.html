<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Entra a tu cuenta')}"></head>
<body>
<main class="auth">
    <span class="logo-tile"><img th:src="@{/img/logo-icon.png}" alt="Radiografía Crediticia"></span>
    <h1 class="titulo">Entra a tu cuenta</h1>

    <div th:if="${param.error}" class="alerta alerta-error" role="alert">Correo o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alerta alerta-info" role="status">Cerraste sesión correctamente.</div>
    <div th:if="${success}" class="alerta alerta-exito" role="status" th:text="${success}"></div>

    <form th:action="@{/login}" method="post" class="form">
        <label for="email">Correo</label>
        <input class="campo" type="email" id="email" name="email" required autofocus autocomplete="username">

        <label for="password">Contraseña</label>
        <input class="campo" type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit" class="btn btn-primario btn-bloque">Entrar</button>
    </form>

    <p class="auth-pie">¿Aún no tienes cuenta? <a th:href="@{/register}">Regístrate</a></p>
</main>
</body>
</html>
