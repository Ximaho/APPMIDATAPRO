<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · MiDataCrédito Analyzer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand">
        <span class="brand-mark">MD</span>
        <div>
            <h1>MiDataCrédito Analyzer</h1>
            <p class="muted">Diagnóstico crediticio con inteligencia artificial</p>
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-error">Correo o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-info">Cerraste sesión correctamente.</div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post" class="form">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="username"
               placeholder="tu@correo.com">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               placeholder="••••••••">

        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a th:href="@{/register}">Regístrate</a></p>
</main>
</body>
</html>
